name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-mac:
    name: macOS (arm64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          npm ci
          cd frontend && npm ci

      - name: Build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install pyinstaller -r backend/requirements.txt
          npm run build:frontend
          python -m PyInstaller --clean --noconfirm --distpath backend/dist --workpath backend/build backend/pybackend.spec
          npx electron-builder --mac --config electron-builder.config.json

      - uses: actions/upload-artifact@v4
        with:
          name: mac-arm64
          path: release/*.dmg
          retention-days: 7

  build-win:
    name: Windows (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          npm ci
          cd frontend && npm ci

      - name: Build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m venv .venv
          call .venv\Scripts\activate
          python -m pip install --upgrade pip
          python -m pip install pyinstaller -r backend\requirements.txt
          npm run build:frontend
          python -m PyInstaller --clean --noconfirm --distpath backend\dist --workpath backend\build backend\pybackend.spec
          npx electron-builder --win --config electron-builder.config.json
        shell: cmd

      - uses: actions/upload-artifact@v4
        with:
          name: win-x64
          path: |
            release/*.exe
          retention-days: 7

  build-linux:
    name: Linux (AppImage)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools appstream
          sudo apt-get install -y fakeroot rpm libdbus-1-dev libglib2.0-dev libgl1-mesa-glx libwebp-dev

      - name: Install dependencies
        run: |
          npm ci
          cd frontend && npm ci

      - name: Build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install pyinstaller -r backend/requirements.txt
          npm run build:frontend
          python -m PyInstaller --clean --noconfirm --distpath backend/dist --workpath backend/build backend/pybackend.spec
          npx electron-builder --linux AppImage --config electron-builder.config.json

      - uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: release/*.AppImage
          retention-days: 7
