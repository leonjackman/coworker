name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-mac:
    name: macOS (arm64)
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      TEAM_ID: K4B9JCX83M
      APP_VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up signing and notarization
        env:
          CERT_P12: ${{ secrets.CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.CERT_PASSWORD }}
        run: |
          SECURITY_DIR="$HOME/signing-security"
          mkdir -p "$SECURITY_DIR"

          # Decode and import Developer ID certificate (p12, encrypted with password)
          echo "$CERT_P12" | base64 --decode > "$SECURITY_DIR/dev-id.p12"

          # Create a temporary keychain
          security create-keychain -p "$CERT_PASSWORD" "$SECURITY_DIR/build.keychain"
          security set-keychain-settings -lut 21600 "$SECURITY_DIR/build.keychain"
          security unlock-keychain -p "$CERT_PASSWORD" "$SECURITY_DIR/build.keychain"
          security list-keychains -s "$SECURITY_DIR/build.keychain" ~/Library/Keychains/login.keychain-db

          # Import the p12 (cert + private key) into the keychain
          security import "$SECURITY_DIR/dev-id.p12" \
            -k "$SECURITY_DIR/build.keychain" \
            -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security \
            -T /bin/sh \
            && echo "Cert imported successfully"

          # Verify the cert identity
          security find-identity -v -p codesigning "$SECURITY_DIR/build.keychain"

          # Export the api key p8 file for notarization
          echo "${{ secrets.APPLE_API_KEY }}" > "$SECURITY_DIR/api-key.p8"

      - name: Grant permission to access certs
        run: |
          chmod -R 700 "$HOME/signing-security"
          xattr -dr com.apple.quarantine "$HOME/signing-security" || true

      - name: Install dependencies
        run: |
          npm ci
          cd frontend && npm ci

      - name: Build
        env:
          APPLE_API_KEY: /Users/runner/signing-security/api-key.p8
          APPLE_API_KEY_ID: ZA2SG3QFCA
          APPLE_API_ISSUER: 069bd8fa-9fbb-4e3d-a03b-96078cfba4e4

        run: |
          python3 -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install pyinstaller -r backend/requirements.txt
          npm run build:frontend
          python -m PyInstaller --clean --noconfirm --distpath backend/dist --workpath backend/build backend/pybackend.spec
          CHANNEL_FLAG=""
          if [[ "$APP_VERSION" =~ -([a-zA-Z]+)(\.[0-9]+)?$ ]]; then
            CHANNEL_FLAG="-c.publish.channel=${BASH_REMATCH[1]}"
          fi
          npx electron-builder --mac --config electron-builder.config.json --publish never $CHANNEL_FLAG -c.extraMetadata.version="${APP_VERSION#v}"

      - uses: actions/upload-artifact@v4
        with:
          name: mac-arm64
          path: |
            release/*.dmg
            release/*.zip
            release/*.yml
          retention-days: 7

  build-win:
    name: Windows (x64)
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          npm ci
          cd frontend && npm ci

      - name: Build
        env:
          APP_VERSION: ${{ github.ref_name }}
        run: |
          python -m venv .venv
          source .venv/Scripts/activate
          python -m pip install --upgrade pip
          python -m pip install pyinstaller -r backend/requirements.txt
          npm run build:frontend
          python -m PyInstaller --clean --noconfirm --distpath backend/dist --workpath backend/build backend/pybackend.spec
          CHANNEL_FLAG=""
          # Prerelease tags (e.g. v1.1.0-beta.1, v1.1.0-rc.1) build into their
          # own channel files (beta-mac.yml, rc-mac.yml); stable tags keep the
          # default latest channel.
          if [[ "$APP_VERSION" =~ -([a-zA-Z]+)(\.[0-9]+)?$ ]]; then
            CHANNEL_FLAG="-c.publish.channel=${BASH_REMATCH[1]}"
          fi
          npx electron-builder --win --config electron-builder.config.json --publish never $CHANNEL_FLAG -c.extraMetadata.version="${APP_VERSION#v}"
        shell: bash

      - uses: actions/upload-artifact@v4
        with:
          name: win-x64
          path: |
            release/*.exe
            release/*.yml
          retention-days: 7

  build-linux-x64:
    name: Linux (x64)
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Linux deps
        timeout-minutes: 15
        run: |
          # GitHub-hosted runners use the Azure Ubuntu mirror, which can be
          # unreachable and hang for hours. Prefer archive.ubuntu.com and cap
          # each apt-get update attempt so the job fails fast instead of stalling.
          sudo sed -i 's#azure\.archive\.ubuntu\.com#archive.ubuntu.com#g' \
            /etc/apt/sources.list /etc/apt/sources.list.d/*.sources \
            /etc/apt/apt-mirrors.txt 2>/dev/null || true
          timeout 300 sudo apt-get update || { echo 'apt-get update failed once, retrying'; timeout 300 sudo apt-get update; }
          sudo apt-get install -y libarchive-tools appstream libgl1 libwebp-dev libglib2.0-dev libdbus-1-dev rpm fakeroot

      - name: Install dependencies
        run: |
          npm ci
          cd frontend && npm ci

      - name: Build
        env:
          APP_VERSION: ${{ github.ref_name }}
        run: |
          python3 -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install pyinstaller -r backend/requirements.txt
          npm run build:frontend
          python -m PyInstaller --clean --noconfirm --distpath backend/dist --workpath backend/build backend/pybackend.spec
          CHANNEL_FLAG=""
          # Prerelease tags (e.g. v1.1.0-beta.1, v1.1.0-rc.1) build into their
          # own channel files (beta-mac.yml, rc-mac.yml); stable tags keep the
          # default latest channel.
          if [[ "$APP_VERSION" =~ -([a-zA-Z]+)(\.[0-9]+)?$ ]]; then
            CHANNEL_FLAG="-c.publish.channel=${BASH_REMATCH[1]}"
          fi
          npx electron-builder --linux AppImage deb --config electron-builder.config.json --publish never $CHANNEL_FLAG -c.extraMetadata.version="${APP_VERSION#v}"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: |
            release/*.AppImage
            release/*.deb
            release/*.yml
          retention-days: 7

  build-linux-arm64:
    name: Linux (arm64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Linux deps
        timeout-minutes: 15
        run: |
          # GitHub-hosted runners use the Azure Ubuntu mirror, which can be
          # unreachable and hang for hours. Prefer archive.ubuntu.com and cap
          # each apt-get update attempt so the job fails fast instead of stalling.
          sudo sed -i 's#azure\.archive\.ubuntu\.com#archive.ubuntu.com#g' \
            /etc/apt/sources.list /etc/apt/sources.list.d/*.sources \
            /etc/apt/apt-mirrors.txt 2>/dev/null || true
          timeout 300 sudo apt-get update || { echo 'apt-get update failed once, retrying'; timeout 300 sudo apt-get update; }
          sudo apt-get install -y libarchive-tools appstream libgl1 libwebp-dev libfuse2t64 libglib2.0-dev libdbus-1-dev rpm fakeroot

      - name: Install dependencies
        run: |
          npm ci
          cd frontend && npm ci

      - name: Build
        env:
          APP_VERSION: ${{ github.ref_name }}
        run: |
          python3 -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install pyinstaller -r backend/requirements.txt
          npm run build:frontend
          python -m PyInstaller --clean --noconfirm --distpath backend/dist --workpath backend/build backend/pybackend.spec
          CHANNEL_FLAG=""
          # Prerelease tags (e.g. v1.1.0-beta.1, v1.1.0-rc.1) build into their
          # own channel files (beta-mac.yml, rc-mac.yml); stable tags keep the
          # default latest channel.
          if [[ "$APP_VERSION" =~ -([a-zA-Z]+)(\.[0-9]+)?$ ]]; then
            CHANNEL_FLAG="-c.publish.channel=${BASH_REMATCH[1]}"
          fi
          npx electron-builder --linux AppImage deb --config electron-builder.config.json --publish never $CHANNEL_FLAG -c.extraMetadata.version="${APP_VERSION#v}"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-arm64
          path: |
            release/*.AppImage
            release/*.deb
            release/*.yml
          retention-days: 7

  release:
    name: Publish Release
    needs: [build-mac, build-win, build-linux-x64, build-linux-arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -R release-artifacts
          mapfile -t FILES < <(find release-artifacts -type f ! -name 'builder-debug.yml')
          PRERELEASE_FLAG=""
          if [[ "${{ github.ref_name }}" =~ -([a-zA-Z]+)(\.[0-9]+)?$ ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          # 從 CHANGELOG.md 擷取本版本說明：先精確版本，再退回 Unreleased，都無則自動生成
          VER="${{ github.ref_name }}"
          VER="${VER#v}"
          NOTES_FILE="--generate-notes"
          extract_section() {
            awk -v name="$1" '
              BEGIN { found=0 }
              /^## / {
                if (found) exit
                if ($0 ~ "^##[ \t]+" name "([ \t]|$)") { found=1; next }
              }
              found { print }
            ' CHANGELOG.md
          }
          if [ -f CHANGELOG.md ]; then
            extract_section "$VER" > /tmp/release_notes.md
            if [ ! -s /tmp/release_notes.md ]; then
              extract_section "Unreleased" > /tmp/release_notes.md
            fi
            if [ -s /tmp/release_notes.md ]; then
              NOTES_FILE="--notes-file /tmp/release_notes.md"
            fi
          fi

          gh release create "${{ github.ref_name }}" "${FILES[@]}" $NOTES_FILE --title "CoWorker ${{ github.ref_name }}" $PRERELEASE_FLAG
