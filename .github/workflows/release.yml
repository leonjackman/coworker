name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-mac:
    name: macOS (arm64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          npm ci
          cd frontend && npm ci

      - name: Build
        env:
          APP_VERSION: ${{ github.ref_name }}
        run: |
          python3 -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install pyinstaller -r backend/requirements.txt
          npm run build:frontend
          python -m PyInstaller --clean --noconfirm --distpath backend/dist --workpath backend/build backend/pybackend.spec
          CHANNEL_FLAG=""
          # Prerelease tags (e.g. v1.1.0-beta.1, v1.1.0-rc.1) build into their
          # own channel files (beta-mac.yml, rc-mac.yml); stable tags keep the
          # default latest channel.
          if [[ "$APP_VERSION" =~ -([a-zA-Z]+)(\.[0-9]+)?$ ]]; then
            CHANNEL_FLAG="-c.publish.channel=${BASH_REMATCH[1]}"
          fi
          npx electron-builder --mac --config electron-builder.config.json --publish never $CHANNEL_FLAG -c.extraMetadata.version="${APP_VERSION#v}"

      - uses: actions/upload-artifact@v4
        with:
          name: mac-arm64
          path: |
            release/*.dmg
            release/*.zip
            release/*.yml
          retention-days: 7

  build-win:
    name: Windows (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          npm ci
          cd frontend && npm ci

      - name: Build
        env:
          APP_VERSION: ${{ github.ref_name }}
        run: |
          python -m venv .venv
          source .venv/Scripts/activate
          python -m pip install --upgrade pip
          python -m pip install pyinstaller -r backend/requirements.txt
          npm run build:frontend
          python -m PyInstaller --clean --noconfirm --distpath backend/dist --workpath backend/build backend/pybackend.spec
          CHANNEL_FLAG=""
          # Prerelease tags (e.g. v1.1.0-beta.1, v1.1.0-rc.1) build into their
          # own channel files (beta-mac.yml, rc-mac.yml); stable tags keep the
          # default latest channel.
          if [[ "$APP_VERSION" =~ -([a-zA-Z]+)(\.[0-9]+)?$ ]]; then
            CHANNEL_FLAG="-c.publish.channel=${BASH_REMATCH[1]}"
          fi
          npx electron-builder --win --config electron-builder.config.json --publish never $CHANNEL_FLAG -c.extraMetadata.version="${APP_VERSION#v}"
        shell: bash

      - uses: actions/upload-artifact@v4
        with:
          name: win-x64
          path: |
            release/*.exe
            release/*.yml
          retention-days: 7

  build-linux-x64:
    name: Linux (x64)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools appstream
          sudo apt-get install -y fakeroot rpm libdbus-1-dev libglib2.0-dev libgl1-mesa-glx libwebp-dev

      - name: Install dependencies
        run: |
          npm ci
          cd frontend && npm ci

      - name: Build
        env:
          APP_VERSION: ${{ github.ref_name }}
        run: |
          python3 -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install pyinstaller -r backend/requirements.txt
          npm run build:frontend
          python -m PyInstaller --clean --noconfirm --distpath backend/dist --workpath backend/build backend/pybackend.spec
          CHANNEL_FLAG=""
          # Prerelease tags (e.g. v1.1.0-beta.1, v1.1.0-rc.1) build into their
          # own channel files (beta-mac.yml, rc-mac.yml); stable tags keep the
          # default latest channel.
          if [[ "$APP_VERSION" =~ -([a-zA-Z]+)(\.[0-9]+)?$ ]]; then
            CHANNEL_FLAG="-c.publish.channel=${BASH_REMATCH[1]}"
          fi
          npx electron-builder --linux AppImage deb --config electron-builder.config.json --publish never $CHANNEL_FLAG -c.extraMetadata.version="${APP_VERSION#v}"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: |
            release/*.AppImage
            release/*.deb
            release/*.yml
          retention-days: 7

  build-linux-arm64:
    name: Linux (arm64)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools appstream
          sudo apt-get install -y fakeroot rpm libdbus-1-dev libglib2.0-dev libgl1-mesa-glx libwebp-dev libfuse2t64

      - name: Install dependencies
        run: |
          npm ci
          cd frontend && npm ci

      - name: Build
        env:
          APP_VERSION: ${{ github.ref_name }}
        run: |
          python3 -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install pyinstaller -r backend/requirements.txt
          npm run build:frontend
          python -m PyInstaller --clean --noconfirm --distpath backend/dist --workpath backend/build backend/pybackend.spec
          CHANNEL_FLAG=""
          # Prerelease tags (e.g. v1.1.0-beta.1, v1.1.0-rc.1) build into their
          # own channel files (beta-mac.yml, rc-mac.yml); stable tags keep the
          # default latest channel.
          if [[ "$APP_VERSION" =~ -([a-zA-Z]+)(\.[0-9]+)?$ ]]; then
            CHANNEL_FLAG="-c.publish.channel=${BASH_REMATCH[1]}"
          fi
          npx electron-builder --linux AppImage deb --config electron-builder.config.json --publish never $CHANNEL_FLAG -c.extraMetadata.version="${APP_VERSION#v}"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-arm64
          path: |
            release/*.AppImage
            release/*.deb
            release/*.yml
          retention-days: 7

  release:
    name: Publish Release
    needs: [build-mac, build-win, build-linux-x64, build-linux-arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -R release-artifacts
          mapfile -t FILES < <(find release-artifacts -type f)
          PRERELEASE_FLAG=""
          if [[ "${{ github.ref_name }}" =~ -([a-zA-Z]+)(\.[0-9]+)?$ ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          gh release create "${{ github.ref_name }}" "${FILES[@]}" --generate-notes --title "CoWorker ${{ github.ref_name }}" $PRERELEASE_FLAG
